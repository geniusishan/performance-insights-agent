name: agent-evals

# Runs the full LLM evaluation on demand (Actions tab -> agent-evals -> Run workflow).
# Manual only (or by editing evals/RUN_EVALS.txt), so ordinary pushes never spend LLM quota.
# Needs repository secrets: LLM_API_KEY and LLM_MODEL (Settings -> Secrets and variables -> Actions).

on:
  workflow_dispatch:
    inputs:
      pause_seconds:
        description: "Seconds between questions (raise if you hit free-tier rate limits)"
        type: string
        required: false
        default: "8"
  push:                      # also runs when evals/RUN_EVALS.txt changes (edit it to re-run from a phone)
    branches: [main]
    paths: [evals/RUN_EVALS.txt]

permissions:
  contents: write   # to commit the report back to the repo

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLM_PROVIDER: gemini
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Check secrets are set
        run: |
          if [ -z "$LLM_API_KEY" ]; then echo "::error::Add the LLM_API_KEY repository secret first"; exit 1; fi
      - run: pip install -r requirements.txt
      - name: Build the warehouse
        run: |
          export PIA_WAREHOUSE=$RUNNER_TEMP/wh.duckdb
          echo "PIA_WAREHOUSE=$PIA_WAREHOUSE" >> $GITHUB_ENV
          FPH_WAREHOUSE=$PIA_WAREHOUSE python -m fph.pipeline run
      - name: Run full evaluation
        id: eval
        run: python -m pia.evals.run_evals --pause "${{ inputs.pause_seconds || '8' }}"
      - name: Publish summary
        if: always() && steps.eval.outcome != 'skipped'
        run: cat evals/report.md >> $GITHUB_STEP_SUMMARY || true
      - name: Commit report to the repo (shown in the app's Evals tab)
        if: always() && steps.eval.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f evals/report.md evals/report.json
          git diff --cached --quiet || git commit -m "Update evaluation report" && git push
